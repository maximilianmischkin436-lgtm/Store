<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Neon Dodge</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a14; overflow: hidden; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
// Neon Dodge: dodge enemies, collect orbs, build combos.
// Controls: mouse / touch moves the player, arrow keys/WASD work too.

const W = 480, H = 720;                 // logische Spielgroesse
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
}
addEventListener("resize", resize);
resize();

// Skalierung + Zentrierung des logischen Spielfelds
function view() {
  const s = Math.min(canvas.width / W, canvas.height / H);
  return { s, ox: (canvas.width - W * s) / 2, oy: (canvas.height - H * s) / 2 };
}

let best = 0;
try { best = +localStorage.getItem("neondodge_best") || 0; } catch (e) {}

// --- Savegame (localStorage) ---
let save = { orbs: 0, bosses: 0, skin: "classic", unlocked: {}, games: 0, bestWave: 0, rp: 0, sp: 0, skills: {}, won: false, streak: 0, lastPlay: "", xp: 0, level: 1, daily: null };
try { Object.assign(save, JSON.parse(localStorage.getItem("neondodge_save") || "{}")); } catch (e) {}
save.unlocked = save.unlocked || {};
save.skills = save.skills || {};
save.unlocked.classic = true;
function persist() { try { localStorage.setItem("neondodge_save", JSON.stringify(save)); } catch (e) {} }

// --- Skill Tree: permanente Upgrades, bezahlt mit Skillpunkten (SP) ---
const BRANCH = { def: "#4da3ff", flow: "#38f5c4", off: "#ff9f3d" };
const SKILLS = [
  { id: "slim",    name: "Slim Hitbox",   branch: "def",  max: 3, cost: 3,  desc: "Smaller hitbox" },
  { id: "shield",  name: "Long Shield",   branch: "def",  max: 3, cost: 4,  desc: "+0.7s shield time", req: ["slim", 1] },
  { id: "wind",    name: "Second Wind",   branch: "def",  max: 1, cost: 15, desc: "Revive once per run", req: ["shield", 2] },
  { id: "keeper",  name: "Combo Keeper",  branch: "flow", max: 3, cost: 3,  desc: "+0.5s combo time" },
  { id: "magnet",  name: "Orb Magnet",    branch: "flow", max: 3, cost: 4,  desc: "Bigger orb pickup range", req: ["keeper", 1] },
  { id: "greed",   name: "Greed",         branch: "flow", max: 3, cost: 5,  desc: "+15% orb score", req: ["magnet", 2] },
  { id: "slow",    name: "Long Slow-mo",  branch: "off",  max: 3, cost: 3,  desc: "+0.7s slow-mo time" },
  { id: "breaker", name: "Boss Breaker",  branch: "off",  max: 2, cost: 8,  desc: "+1 boss damage per orb", req: ["slow", 1] },
  { id: "luck",    name: "Lucky Drops",   branch: "off",  max: 3, cost: 5,  desc: "Power-ups come 12% sooner", req: ["breaker", 1] },
];
const lvl = id => save.skills[id] || 0;
const skillCost = k => k.cost * (lvl(k.id) + 1);
function skillState(k) {                          // "max" | "needs" | "poor" | "ok"
  if (lvl(k.id) >= k.max) return "max";
  if (k.req && lvl(k.req[0]) < k.req[1]) return "needs";
  return save.sp >= skillCost(k) ? "ok" : "poor";
}
const shieldDur = () => 5 + 0.7 * lvl("shield");
const slowDur = () => 5 + 0.7 * lvl("slow");
const comboDur = () => 3.5 + 0.5 * lvl("keeper");

// --- Tagesmissionen (3 pro Tag, jede muss in EINEM Durchgang geschafft werden) ---
const MISSIONS = [
  { txt: n => "Collect " + n + " orbs in one run", vals: [25, 40, 60], val: () => orbsCollected },
  { txt: n => "Reach wave " + n, vals: [4, 6, 8], val: () => wave },
  { txt: n => "Get " + n + " close calls in one run", vals: [6, 10, 15], val: () => nearMiss },
  { txt: n => "Reach a x" + n + " combo", vals: [6, 8, 10], val: () => maxCombo },
  { txt: n => "Score " + n + " in one run", vals: [1000, 2000, 3000], val: () => score },
  { txt: n => "Collect " + n + " power-ups in one run", vals: [3, 4, 6], val: () => powersTaken },
  { txt: n => "Destroy " + n + " enemies with the shield", vals: [4, 6, 8], val: () => shieldKills },
  { txt: n => "Collect " + n + " golden orbs in one run", vals: [1, 2, 3], val: () => goldTaken },
];
const MISSION_REWARD = [8, 12, 18], MISSION_BONUS = 10;
const todayStr = () => new Date().toLocaleDateString("en-CA");
function ensureDaily() {
  const t = todayStr();
  if (save.daily && save.daily.day === t) return;
  let h = 0; for (const ch of t) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const rnd = () => (h = (h * 1664525 + 1013904223) >>> 0) / 4294967296;
  const pool = MISSIONS.map((_, i) => i), picks = [];
  while (picks.length < 3) picks.push(pool.splice(Math.floor(rnd() * pool.length), 1)[0]);
  save.daily = { day: t, picks, done: [false, false, false], bonus: false };
  persist();
}
ensureDaily();
function dailyLogin() {
  ensureDaily();
  const t = todayStr();
  if (save.lastPlay === t) return;
  const y = new Date(Date.now() - 864e5).toLocaleDateString("en-CA");
  save.streak = save.lastPlay === y ? save.streak + 1 : 1;
  save.lastPlay = t;
  const bonus = Math.min(save.streak, 7) * 2;
  save.sp += bonus; persist();
  banner = { text: "Daily streak x" + save.streak + ": +" + bonus + " SP", color: "#ffd23d", t: 3.5 };
}
function checkMissions() {
  const d = save.daily;
  d.picks.forEach((idx, i) => {
    const m = MISSIONS[idx];
    if (!d.done[i] && m.val() >= m.vals[i]) {
      d.done[i] = true; save.sp += MISSION_REWARD[i];
      banner = { text: "Mission complete! +" + MISSION_REWARD[i] + " SP", color: "#38f5c4", t: 3 };
      beep(900, 0.25, "sine", 0.08);
      if (d.done.every(Boolean) && !d.bonus) { d.bonus = true; save.sp += MISSION_BONUS; banner.text += "  (all done +" + MISSION_BONUS + ")"; }
      persist();
    }
  });
}
const missionsLeft = () => save.daily.done.filter(x => !x).length;
const xpNeed = l => 120 + 60 * l;

// --- Ranked: jeder Durchgang zaehlt, Rating (RP) steigt oder faellt je nach erreichter Welle ---
const RANKS = [
  { n: "Bronze", c: "#c8814a", exp: 3 }, { n: "Silver", c: "#c0c8d8", exp: 7 }, { n: "Gold", c: "#ffd23d", exp: 12 },
  { n: "Platinum", c: "#4de3c8", exp: 18 }, { n: "Diamond", c: "#6fb7ff", exp: 25 }, { n: "Master", c: "#b45cff", exp: 35 },
  { n: "Legend", c: "#ff4d6d", exp: 50 },
];
const rankIdx = rp => Math.min(6, Math.floor(rp / 100));
function rankLabel(rp) {
  const i = rankIdx(rp);
  if (i === 6) return "Legend";
  const t = rp % 100;
  return RANKS[i].n + " " + (t < 34 ? "III" : t < 67 ? "II" : "I");
}
let lastRun = { d: 0, sp: 0, xp: 0, ups: 0, up: false, down: false }, runDone = false, runBosses = 0, revived = false;
function finishRun() {
  if (runDone) return;
  runDone = true;
  const before = rankIdx(save.rp);
  const d = Math.max(-30, Math.min(70, Math.round((wave - RANKS[before].exp) * 7) + 20 * runBosses));
  save.rp = Math.max(0, save.rp + d);
  const sp = wave + 3 * runBosses;
  save.sp += sp; save.games++; save.bestWave = Math.max(save.bestWave, wave);
  const xp = Math.floor(score / 10) + wave * 5 + runBosses * 100;
  save.xp += xp; let ups = 0;
  while (save.xp >= xpNeed(save.level)) { save.xp -= xpNeed(save.level); save.level++; save.sp += 3; ups++; }
  lastRun = { d, sp, xp, ups, up: rankIdx(save.rp) > before, down: rankIdx(save.rp) < before };
  persist();
}

// --- Skins: jeder Skin wird durch eine Challenge freigeschaltet ---
const SKINS = [
  { id: "classic", name: "Classic", color: "#ffffff", shape: "circle", goal: "Unlocked from the start", test: () => true },
  { id: "ember", name: "Ember", color: "#ff9f3d", shape: "circle", goal: "Collect 300 orbs in total",
    test: () => save.orbs >= 300, prog: () => Math.min(save.orbs, 300) + "/300" },
  { id: "mint", name: "Mint", color: "#38f5c4", shape: "diamond", goal: "Reach wave 3 in one run",
    test: () => wave >= 3 },
  { id: "violet", name: "Violet", color: "#b45cff", shape: "square", goal: "Get 15 close calls in one run",
    test: () => nearMiss >= 15 },
  { id: "sun", name: "Sun", color: "#ffd23d", shape: "star", goal: "Defeat a boss",
    test: () => save.bosses >= 1 },
  { id: "ghost", name: "Ghost", color: "#bbbbff", shape: "ring", goal: "Reach a x10 combo",
    test: () => maxCombo >= 10 },
  { id: "rainbow", name: "Rainbow", color: "#ffffff", shape: "circle", rainbow: true, goal: "Score 5000 in one run",
    test: () => score >= 5000 },
  { id: "frost", name: "Frost", color: "#7ad7ff", shape: "hex", goal: "Defeat 5 bosses in total",
    test: () => save.bosses >= 5, prog: () => Math.min(save.bosses, 5) + "/5" },
  { id: "obsidian", name: "Obsidian", color: "#8a8ab0", shape: "hex", goal: "Play 50 runs",
    test: () => save.games >= 50, prog: () => Math.min(save.games, 50) + "/50" },
  { id: "diamond", name: "Diamond", color: "#6fb7ff", shape: "diamond", goal: "Reach Diamond rank",
    test: () => rankIdx(save.rp) >= 4, prog: () => save.rp + "/400 RP" },
  { id: "crimson", name: "Crimson", color: "#ff2d55", shape: "star", goal: "Collect 2000 orbs in total",
    test: () => save.orbs >= 2000, prog: () => Math.min(save.orbs, 2000) + "/2000" },
  { id: "champion", name: "Champion", color: "#ffffff", shape: "star", rainbow: true, goal: "Defeat the final boss (wave 100)",
    test: () => !!save.won },
];
function currentSkin() { return SKINS.find(k => k.id === save.skin && save.unlocked[k.id]) || SKINS[0]; }
let newUnlocks = [], banner = null;
function checkUnlocks() {
  for (const sk of SKINS) {
    if (!save.unlocked[sk.id] && sk.test()) {
      save.unlocked[sk.id] = true; persist(); newUnlocks.push(sk.name);
      banner = { text: "Skin unlocked: " + sk.name, color: "#ffd23d", t: 3 };
      beep(1000, 0.3, "sine", 0.08);
    }
  }
}

// --- Audio (kleine Beeps, kein Asset noetig) ---
let actx = null;
let muted = false;
try { muted = localStorage.getItem("neondodge_muted") === "1"; } catch (e) {}
function setMuted(m) { muted = m; try { localStorage.setItem("neondodge_muted", m ? "1" : "0"); } catch (e) {} }
function beep(freq, dur, type = "square", vol = 0.05) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
}

const stars = Array.from({ length: 50 }, () => ({ x: Math.random() * W, y: Math.random() * H, z: 0.3 + Math.random() }));

// --- Zustand ---
let state = "menu";                     // menu | skins | tree | missions | play | over | win
let nearMiss = 0, missText = 0, orbsCollected = 0, maxCombo = 1, powersTaken = 0, shieldKills = 0, goldTaken = 0, flash = 0, pops = [];
let boss = null, bossBanner = 0, beamT = 0;
let paused = false, wave = 1, waveBanner = 0, musicT = 0, musicStep = 0;
let player, enemies, orbs, powers, particles, score, combo, comboTimer, time, spawnT, orbT, powerT, shieldT, slowT, shake;
const target = { x: W / 2, y: H * 0.75 };
const keys = {};

function reset() {
  player = { x: W / 2, y: H * 0.75, r: 12 - 0.9 * lvl("slim"), trail: [] };
  target.x = player.x; target.y = player.y;
  enemies = []; orbs = []; powers = []; particles = [];
  score = 0; combo = 1; comboTimer = 0; time = 0; spawnT = 1.5; orbT = 0; shake = 0;
  runDone = false; runBosses = 0; revived = false; powersTaken = 0; shieldKills = 0; goldTaken = 0; flash = 0; pops = [];
  powerT = 8; shieldT = 0; slowT = 0; nearMiss = 0; missText = 0; orbsCollected = 0; maxCombo = 1; boss = null; bossBanner = 0; beamT = 0; wave = 1; waveBanner = 0; paused = false;
}
reset();

function burst(x, y, color, n = 14) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = 40 + Math.random() * 180;
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.6, color });
  }
}

function spawnEnemy() {
  const speed = 62 + Math.min(wave * 3.2, 190) + Math.random() * 30;   // steigt langsam mit der Welle
  const side = Math.floor(Math.random() * 3);   // oben, links, rechts
  let x, y, vx = 0, vy = 0;
  if (side === 0) { x = Math.random() * W; y = -20; vy = speed; vx = (Math.random() - 0.5) * 50; }
  else if (side === 1) { x = -20; y = Math.random() * H * 0.6; vx = speed; vy = speed * 0.3; }
  else { x = W + 20; y = Math.random() * H * 0.6; vx = -speed; vy = speed * 0.3; }
  let r = 9 + Math.random() * (7 + Math.min(wave, 20) * 0.3), type = "normal";
  const roll = Math.random();
  if (wave >= 6 && roll < 0.12) {               // Seeker: verfolgt den Spieler
    type = "seeker"; r = 9; vx = 0; vy = 0;
  } else if (wave >= 3 && roll < 0.27) {        // Tank: gross und langsam
    type = "tank"; r = 24; vx *= 0.5; vy = Math.abs(vy) * 0.5 + 35;
  }
  enemies.push({ x, y, vx, vy, r, type });
}

function spawnOrb() {
  const gold = Math.random() < 0.1;               // goldener Orb: 4x Punkte, +2 Combo
  orbs.push({ x: 30 + Math.random() * (W - 60), y: 160 + Math.random() * (H - 240), r: gold ? 11 : 9, life: gold ? 3 : 5, gold });
}

function spawnPower() {
  powers.push({ x: 40 + Math.random() * (W - 80), y: 80 + Math.random() * (H - 160), r: 12, life: 6,
                kind: (r => wave >= 3 && r < 0.25 ? "bomb" : r < 0.65 ? "shield" : "slow")(Math.random()) });
}

// 10 verschiedene Bosse: Welle 10, 20, ... 100 (Welle 100 = Endboss)
const BOSSES = [
  { name: "Pulse",    color: "#ff2d55", hp: 14, rate: 1.7, spd: 0.6, patterns: ["aim", "fan"] },
  { name: "Spinner",  color: "#b45cff", hp: 18, rate: 2.2, spd: 0.7, patterns: ["spiral", "aim"] },
  { name: "Sweeper",  color: "#ff9f3d", hp: 22, rate: 2.0, spd: 1.0, patterns: ["columns", "fan"] },
  { name: "Hunter",   color: "#ff4df0", hp: 26, rate: 1.9, spd: 0.7, patterns: ["summon", "aim", "ring"] },
  { name: "Prism",    color: "#4da3ff", hp: 30, rate: 1.5, spd: 0.8, patterns: ["ring", "aim", "fan"] },
  { name: "Rain",     color: "#38c9ff", hp: 34, rate: 2.2, spd: 0.7, patterns: ["rain", "aim", "columns"] },
  { name: "Vortex",   color: "#9dff4d", hp: 38, rate: 2.0, spd: 0.9, patterns: ["spiral2", "ring"] },
  { name: "Dasher",   color: "#ffd23d", hp: 42, rate: 1.8, spd: 0.8, patterns: ["dash", "fan", "aim"] },
  { name: "Hydra",    color: "#ff5f3d", hp: 48, rate: 1.6, spd: 0.9, patterns: ["summon", "fan", "ring", "aim", "dash"] },
  { name: "OVERLORD", color: "#ffffff", hp: 90, rate: 1.4, spd: 0.9, r: 60,
    patterns: ["aim", "spiral2", "columns", "ring", "dash", "rain", "summon", "fan"] },
];

function startBoss() {
  const n = wave <= 100 ? wave / 10 - 1 : (wave / 10 - 1) % 9, def = BOSSES[n];   // nach Welle 100: Endless, Bosse wiederholen sich staerker
  const mul = wave > 100 ? 1 + (wave - 100) / 40 : 1, hp = Math.round(def.hp * mul);
  enemies = [];
  boss = { x: W / 2, y: -80, r: def.r || 44, n, def, hp, maxhp: hp, final: wave === 100, t: 0, fireT: 2, pat: 0,
           hitCd: 0, flash: 0, mode: "idle", modeT: 0, vx: 0, vy: 0, spiral: 0, spT: 0, ang: 0, dbl: false, rain: 0, rainT: 0 };
  bossBanner = 3.5;
  beep(80, 0.6, "sawtooth", 0.09);
}

function bullet(x, y, a, sp) {
  enemies.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 6, type: "bullet" });
}
function bossFire() {
  const b = boss, n = b.n, sp = 125 + n * 8, aim = Math.atan2(player.y - b.y, player.x - b.x);
  const name = b.def.patterns[b.pat++ % b.def.patterns.length];
  let cd = b.def.rate;
  switch (name) {
    case "aim": for (const d of (n > 3 ? [-0.4, -0.2, 0, 0.2, 0.4] : [-0.28, 0, 0.28])) bullet(b.x, b.y, aim + d, sp + 20); break;
    case "fan": { const k = 5 + Math.floor(n / 3); for (let i = 0; i < k; i++) bullet(b.x, b.y, Math.PI / 2 + (i - (k - 1) / 2) * 0.32, sp); break; }
    case "ring": { const k = 8 + n, o = Math.random() * 6; for (let i = 0; i < k; i++) bullet(b.x, b.y, o + i / k * Math.PI * 2, sp - 15); break; }
    case "spiral": b.spiral = 1.8; b.dbl = false; b.ang = Math.random() * 6; cd += 1.6; break;
    case "spiral2": b.spiral = 2; b.dbl = true; b.ang = Math.random() * 6; cd += 1.8; break;
    case "columns": {                                  // Wand mit Luecke
      const gx = 80 + Math.random() * (W - 160);
      for (let x = 10; x < W; x += 40) if (Math.abs(x - gx) > 70) bullet(x, -10, Math.PI / 2, sp * 0.8);
      break;
    }
    case "rain": b.rain = 3; cd += 2; break;
    case "summon": for (let i = 0; i < (n >= 8 ? 3 : 2); i++) enemies.push({ x: b.x + (i - 1) * 30, y: b.y, vx: 0, vy: 40, r: 9, type: "seeker", age: 3 }); break;
    case "dash": b.mode = "tele"; b.modeT = 0.9; cd += 2.4; break;
  }
  b.fireT = Math.max(0.6, cd * (0.7 + 0.3 * b.hp / b.maxhp));       // schneller bei wenig Leben
  beep(200, 0.08, "square", 0.04);
}
function updateBoss(edt, dt) {
  const b = boss, homeX = W / 2 + Math.sin(b.t * b.def.spd) * (W / 2 - 90), homeY = 190;
  b.t += edt;
  b.hitCd = Math.max(0, b.hitCd - dt); b.flash = Math.max(0, b.flash - dt);
  if (b.mode === "idle") {
    b.x = homeX; b.y += (homeY - b.y) * Math.min(1, 2 * edt);
    b.fireT -= edt;
    if (b.fireT <= 0 && b.y > 150) bossFire();
  } else if (b.mode === "tele") {                       // Dash ankuendigen (blinkt)
    b.modeT -= edt; b.flash = 0.06;
    if (b.modeT <= 0) {
      const a = Math.atan2(player.y - b.y, player.x - b.x);
      b.vx = Math.cos(a) * 560; b.vy = Math.sin(a) * 560; b.mode = "dash"; b.modeT = 0.55;
    }
  } else if (b.mode === "dash") {
    b.x += b.vx * edt; b.y += b.vy * edt; b.modeT -= edt;
    if (b.modeT <= 0 || b.y > H - 30 || b.x < 30 || b.x > W - 30) b.mode = "back";
  } else {
    b.x += (homeX - b.x) * Math.min(1, 3 * edt); b.y += (homeY - b.y) * Math.min(1, 3 * edt);
    if (Math.hypot(homeX - b.x, homeY - b.y) < 12) b.mode = "idle";
  }
  if (b.spiral > 0) {                                   // Spirale
    b.spiral -= edt; b.spT -= edt;
    if (b.spT <= 0) {
      const sp = 125 + b.n * 8;
      bullet(b.x, b.y, b.ang, sp); if (b.dbl) bullet(b.x, b.y, b.ang + Math.PI, sp);
      b.ang += 0.5; b.spT = 0.1;
    }
  }
  if (b.rain > 0) {                                     // Regen von oben
    b.rain -= edt; b.rainT -= edt;
    if (b.rainT <= 0) { bullet(20 + Math.random() * (W - 40), -10, Math.PI / 2, 150 + b.n * 8); b.rainT = 0.11; }
  }
}
function damageBoss(d) {
  if (!boss) return;
  boss.hp -= d; boss.flash = 0.15; shake = Math.max(shake, 0.08);
  burst(boss.x + (Math.random() - 0.5) * 40, boss.y + (Math.random() - 0.5) * 40, "#ffd23d", 10);
  beep(260, 0.08, "sawtooth", 0.06);
  if (boss.hp <= 0) {
    const bonus = 500 + boss.n * 400, final = boss.final;
    runBosses++;
    score += bonus; save.bosses++;
    burst(boss.x, boss.y, boss.def.color, 70); shake = 0.5;
    banner = { text: boss.def.name + " defeated!  +" + bonus, color: "#ffd23d", t: 3 };
    enemies = []; shieldT = Math.max(shieldT, 3); boss = null;
    beep(500, 0.5, "triangle", 0.09);
    if (final) { save.won = true; finishRun(); checkUnlocks(); persist(); if (score > best) { best = Math.floor(score); try { localStorage.setItem("neondodge_best", best); } catch (e) {} } state = "win"; overT = 0; return; }
    persist();
  }
}

function startGame() {
  reset();
  newUnlocks = []; banner = null;
  dailyLogin();
  state = "play";
  beep(520, 0.12, "triangle");
}

function gameOver() {
  if (lvl("wind") > 0 && !revived) {               // Second Wind: einmal pro Run wiederbeleben
    revived = true; shieldT = 3; enemies = [];
    burst(player.x, player.y, "#4da3ff", 40); shake = 0.3; beep(700, 0.4, "sine", 0.09);
    banner = { text: "Second Wind!", color: "#4da3ff", t: 2 };
    return;
  }
  state = "over";
  shake = 0.4;
  burst(player.x, player.y, "#ff3d6e", 40);
  beep(120, 0.5, "sawtooth", 0.08);

// --- Eingabe ---
let touchOffset = 0;
function setTarget(clientX, clientY) {

  target.y = Math.max(0, Math.min(H, (clientY * dpr - v.oy) / v.s));

canvas.addEventListener("pointermove", e => { if (state === "play") setTarget(e.clientX, e.clientY); });

}
const inRect = (p, x1, y1, x2, y2) => p.x > x1 && p.x < x2 && p.y > y1 && p.y < y2;
const inMuteBtn = p => inRect(p, W - 56, 36, W, 80);

}

    const k = SKILLS[i];
    if (skillState(k) === "ok") { save.sp -= skillCost(k); save.skills[k.id] = lvl(k.id) + 1; persist(); beep(800, 0.15, "triangle", 0.07); }
    else beep(150, 0.1, "square");

}
function openScreen(name) { enemies = []; orbs = []; powers = []; particles = []; boss = null; state = name; }
canvas.addEventListener("pointerdown", e => {
  touchOffset = e.pointerType === "touch" ? 50 : 0;   // finger should not hide the player
  const p = toLogical(e);
  if ((state === "play" || state === "menu") && inMuteBtn(p)) { setMuted(!muted); return; }
  if (paused) { paused = false; return; }
  if (state === "skins") { skinsClick(p); return; }
  if (state === "tree") { treeClick(p); return; }
  if (state === "missions") { if (inBackBtn(p)) state = "menu"; return; }
  if (state === "win") {
    if (overT > 1) {
      if (inRect(p, 170, 575, 310, 620)) { reset(); state = "menu"; }
      else { state = "play"; spawnT = 2; banner = { text: "ENDLESS MODE", color: "#ff4d6d", t: 3 }; }   // weiterspielen
    }
    return;
  }
  if ((state === "menu" || state === "over") && inSkinsBtn(p)) { openScreen("skins"); return; }
  if ((state === "menu" || state === "over") && inSkillsBtn(p)) { openScreen("tree"); return; }
  if ((state === "menu" || state === "over") && inMissionsBtn(p)) { openScreen("missions"); return; }
  if (state === "menu") { startGame(); setTarget(e.clientX, e.clientY); }
  else if (state === "over" && overT > 0.6) { startGame(); setTarget(e.clientX, e.clientY); }
  else if (state === "play") setTarget(e.clientX, e.clientY);
});
function togglePause() { if (state === "play") paused = !paused; }
addEventListener("blur", () => { if (state === "play") paused = true; });
document.addEventListener("visibilitychange", () => { if (document.hidden && state === "play") paused = true; });
addEventListener("keydown", e => {

  if (e.key === "m" || e.key === "M") setMuted(!muted);

  else if ((e.key === " " || e.key === "Enter") && state === "over" && overT > 0.6) startGame();

addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

// --- Update ---
let overT = 0;
function music(dt) {
  if (muted || state !== "play") return;
  musicT -= dt;
  if (musicT > 0) return;
  musicT = boss ? 0.16 : Math.max(0.13, 0.22 - wave * 0.0012);          // Boss: schneller und dunkler
  const scale = boss ? [98, 116.5, 130.8, 155.6, 174.6, 196] : [110, 130.8, 146.8, 164.8, 196, 220];
  const notes = boss ? [0, 0, 3, 0, 2, 0, 4, 3] : [0, 2, 4, 2, 0, 3, 5, 3];
  const st = musicStep++;
  beep(scale[notes[st % 8]] * (st % 16 < 8 ? 1 : 1.5), 0.2, boss ? "sawtooth" : "triangle", boss ? 0.02 : 0.025);
  if (st % 4 === 0) beep(55, 0.12, "sine", 0.07);                          // Kick
  if (st % 4 === 2) beep(boss ? 330 : 440, 0.04, "square", 0.012);         // Hi-Hat-Tick
  if (wave >= 5 && st % 8 === 6) beep(scale[5] * 2, 0.08, "triangle", 0.02);   // Extra-Melodie ab Welle 5
}

function update(dt) {
  if (paused) return;
  if (state === "over" || state === "win") overT += dt; else overT = 0;
  shake = Math.max(0, shake - dt);

  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  for (const q of pops) { q.y -= 40 * dt; q.t -= dt; }
  pops = pops.filter(q => q.t > 0);
  flash = Math.max(0, flash - dt);

  if (state !== "play") return;

  if (!boss) time += dt;                       // waehrend des Bosses steigt die Schwierigkeit nicht
  score += dt * 5 * combo;
  music(dt);
  waveBanner = Math.max(0, waveBanner - dt);
  missText = Math.max(0, missText - dt);
  bossBanner = Math.max(0, bossBanner - dt);
  beamT = Math.max(0, beamT - dt);
  if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
  const w = 1 + Math.floor(time / 15);
  if (w > wave) { wave = w; waveBanner = 2; score += 100; beep(700, 0.3, "sine", 0.07); if (wave % 10 === 0 && !boss) startBoss(); }

  // Tastatursteuerung bewegt das Ziel
  const k = 340 * dt;
  if (keys["arrowleft"] || keys["a"]) target.x -= k;
  if (keys["arrowright"] || keys["d"]) target.x += k;
  if (keys["arrowup"] || keys["w"]) target.y -= k;
  if (keys["arrowdown"] || keys["s"]) target.y += k;
  target.x = Math.max(0, Math.min(W, target.x));
  target.y = Math.max(0, Math.min(H, target.y));

  // Spieler folgt weich dem Ziel
  const f = 1 - Math.pow(0.0005, dt);
  player.x += (target.x - player.x) * f;
  player.y += (target.y - player.y) * f;
  player.trail.push({ x: player.x, y: player.y }); if (player.trail.length > 10) player.trail.shift();

  // Spawns werden mit der Zeit haeufiger
  spawnT -= dt;
  if (spawnT <= 0 && !boss) { spawnEnemy(); spawnT = Math.max(0.22, 1.15 - wave * 0.011); }
  orbT -= dt;
  if (orbT <= 0) { spawnOrb(); orbT = boss ? 0.8 : 1.1; }

  powerT -= dt;
  if (powerT <= 0) { spawnPower(); powerT = (9 + Math.random() * 4) * (1 - 0.12 * lvl("luck")); }
  shieldT = Math.max(0, shieldT - dt);
  slowT = Math.max(0, slowT - dt);
  const edt = slowT > 0 ? dt * 0.4 : dt;       // Zeitlupe wirkt nur auf Gegner

  if (boss) {
    updateBoss(edt, dt);
    if (Math.hypot(boss.x - player.x, boss.y - player.y) < boss.r + player.r - 2) {
      if (shieldT > 0) { if (boss.hitCd <= 0) { boss.hitCd = 1; damageBoss(2); } }
      else { gameOver(); return; }
    }
  }

  for (const e of enemies) {
    if (e.type === "seeker") {
      const a = Math.atan2(player.y - e.y, player.x - e.x), sp = 85 + Math.min(wave * 1.2, 80);
      e.vx += (Math.cos(a) * sp - e.vx) * Math.min(1, 1.6 * edt);
      e.vy += (Math.sin(a) * sp - e.vy) * Math.min(1, 1.6 * edt);
      e.age = (e.age || 0) + edt;
    }
    e.x += e.vx * edt; e.y += e.vy * edt;
    if (Math.hypot(e.x - player.x, e.y - player.y) < e.r + player.r - 2) {
      if (shieldT > 0) {                        // Schild zerstoert den Gegner
        e.dead = true; shieldKills++; score += 25 * combo; burst(e.x, e.y, "#4da3ff", 18); shake = 0.12; beep(300, 0.12, "sawtooth");
      } else { gameOver(); return; }
    }
    else if (!e.missed && e.type !== "seeker" && e.type !== "bullet" && Math.hypot(e.x - player.x, e.y - player.y) < e.r + player.r + 22) {
      e.missed = true; nearMiss++; missText = 0.8; pops.push({ x: player.x, y: player.y - 20, t: 0.7, txt: "close!", c: "#ffd23d" }); score += 15 * combo; beep(900, 0.05, "square", 0.03);
    }
    if (e.type === "seeker" && e.age > 9) e.dead = true;   // Seeker loesen sich auf
  }
  enemies = enemies.filter(e => !e.dead && e.x > -60 && e.x < W + 60 && e.y < H + 60 && e.y > -90);

  for (const pw of powers) {
    pw.life -= dt;
    if (Math.hypot(pw.x - player.x, pw.y - player.y) < pw.r + player.r + 4) {
      pw.life = 0; powersTaken++;
      if (pw.kind === "shield") shieldT = shieldDur();
      else if (pw.kind === "slow") slowT = slowDur();
      else {                                      // Bombe: raeumt alles ab

        enemies = []; flash = 0.3; shake = 0.25; if (boss) damageBoss(4);
        pops.push({ x: pw.x, y: pw.y, t: 1, txt: "BOOM!", c: "#ff4df0" });
      }
      burst(pw.x, pw.y, POWER[pw.kind].c, 18);
      beep(880, 0.2, "sine", 0.07);
    }
  }
  powers = powers.filter(pw => pw.life > 0);

  for (const o of orbs) o.life -= dt;
  for (const o of orbs) {
    if (Math.hypot(o.x - player.x, o.y - player.y) < o.r + player.r + 4 + 14 * lvl("magnet")) {
      o.life = 0;
      const pts = Math.round(50 * combo * (1 + 0.15 * lvl("greed")) * (o.gold ? 4 : 1));
      score += pts; if (o.gold) goldTaken++;
      pops.push({ x: o.x, y: o.y, t: 0.8, txt: "+" + pts, c: o.gold ? "#ffd23d" : "#38f5c4" });
      combo = Math.min(combo + (o.gold ? 2 : 1), 10); maxCombo = Math.max(maxCombo, combo); orbsCollected++;
      save.orbs++; persist();
      if (boss) { damageBoss((combo >= 5 ? 3 : 2) + lvl("breaker")); beamT = 0.12; }
      comboTimer = comboDur();
      burst(o.x, o.y, o.gold ? "#ffd23d" : "#38f5c4", o.gold ? 20 : 12);
      beep(600 + combo * 60, 0.1, "triangle");
    }
  }
  orbs = orbs.filter(o => o.life > 0);

  if (comboTimer > 0) { comboTimer -= dt; if (comboTimer <= 0) combo = 1; }
  if (state === "play") { checkUnlocks(); checkMissions(); }
}

// --- Zeichnen ---
const POWER = { shield: { c: "#4da3ff", l: "S" }, slow: { c: "#ffd23d", l: "Z" }, bomb: { c: "#ff4df0", l: "B" } };
function drawSkin(sk, x, y, r) {
  const c = sk.rainbow ? "hsl(" + (performance.now() / 8 % 360) + ",90%,65%)" : sk.color;
  glow(c, 22); ctx.fillStyle = c; ctx.strokeStyle = c; ctx.lineWidth = 3;
  ctx.beginPath();
  const poly = (n, rot, ro, ri) => {
    for (let i = 0; i < n * (ri ? 2 : 1); i++) {
      const rr = ri && i % 2 ? ri : ro, a = rot + i * Math.PI / (ri ? n : n / 2);
      ctx[i ? "lineTo" : "moveTo"](x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    ctx.closePath();
  };
  switch (sk.shape) {
    case "ring": ctx.arc(x, y, r - 1.5, 0, Math.PI * 2); ctx.stroke(); break;
    case "square": ctx.rect(x - r * 0.85, y - r * 0.85, r * 1.7, r * 1.7); ctx.fill(); break;
    case "diamond": poly(4, 0, r * 1.15); ctx.fill(); break;
    case "star": poly(5, -Math.PI / 2, r * 1.3, r * 0.55); ctx.fill(); break;
    case "hex": poly(6, 0, r * 1.1); ctx.fill(); break;
    default: ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }

}

function circle(x, y, r, color, blur = 14) {
  glow(color, blur); ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
}
function text(str, x, y, size, color = "#fff", align = "center") {
  ctx.font = `bold ${size}px system-ui, sans-serif`;
  ctx.fillStyle = color; ctx.textAlign = align; ctx.fillText(str, x, y);
}

function draw() {
  const v = view();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#0a0a14"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  const sx = shake > 0 ? (Math.random() - 0.5) * 14 : 0, sy = shake > 0 ? (Math.random() - 0.5) * 14 : 0;
  ctx.setTransform(v.s, 0, 0, v.s, v.ox + sx, v.oy + sy);

  // Spielfeld-Hintergrund mit Raster
  ctx.fillStyle = "#10101f"; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "rgba(120,120,255,0.08)"; ctx.lineWidth = 1;
  const off = (time * 30) % 40;
  for (let y = off; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }

  for (const st of stars) {
    if (state === "play" && !paused) { st.y += st.z * 0.6; if (st.y > H) { st.y = 0; st.x = Math.random() * W; } }
    ctx.fillStyle = "rgba(180,180,255," + (0.15 + st.z * 0.25) + ")";
    ctx.fillRect(st.x, st.y, st.z * 2, st.z * 2);
  }
  for (const o of orbs) {
    const pulse = 1 + Math.sin(o.life * 8) * 0.12;
    ctx.globalAlpha = Math.min(1, o.life);
    circle(o.x, o.y, o.r * pulse, o.gold ? "#ffd23d" : "#38f5c4", o.gold ? 26 : 18);
  }
  ctx.globalAlpha = 1;
  for (const pw of powers) {
    ctx.globalAlpha = Math.min(1, pw.life);
    circle(pw.x, pw.y, pw.r, POWER[pw.kind].c, 20);
    text(POWER[pw.kind].l, pw.x, pw.y + 6, 16, "#0a0a14");
  }
  ctx.globalAlpha = 1;
  for (const e of enemies) {
    const c = e.type === "seeker" ? "#ff9f3d" : e.type === "tank" ? "#b45cff" : e.type === "bullet" ? "#ff7a9a" : "#ff3d6e";
    circle(e.x, e.y, e.r, c, 16);
  }
  if (boss) {
    const bc = boss.flash > 0 ? "#ffffff" : boss.def.color, k = boss.r / 44;
    circle(boss.x, boss.y, boss.r + Math.sin(boss.t * 4) * 2, bc, 30);
    circle(boss.x - 15 * k, boss.y - 6 * k, 7 * k, "#0a0a14", 0); circle(boss.x + 15 * k, boss.y - 6 * k, 7 * k, "#0a0a14", 0);
    ctx.fillStyle = "#0a0a14"; ctx.fillRect(boss.x - 16 * k, boss.y + 14 * k, 32 * k, 5);
    if (beamT > 0) {
      ctx.strokeStyle = "rgba(255,210,61," + beamT * 6 + ")"; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(boss.x, boss.y); ctx.stroke();
    }
  }
  for (const p of particles) { ctx.globalAlpha = Math.max(0, p.life / 0.6); circle(p.x, p.y, 3, p.color, 8); }

  if (state === "play" && player.trail) {

    }
  }
  for (const q of pops) { ctx.globalAlpha = Math.min(1, q.t * 2); text(q.txt, q.x, q.y, 15, q.c); }
  ctx.globalAlpha = 1;
  if (flash > 0) { ctx.fillStyle = "rgba(255,255,255," + flash * 1.6 + ")"; ctx.fillRect(0, 0, W, H); }
  if (state === "play" && slowT > 0) { ctx.fillStyle = "rgba(255,210,61,0.06)"; ctx.fillRect(0, 0, W, H); }

  if (state === "play") {
    text(String(Math.floor(score)), W / 2, 56, 40);
    if (combo > 1) {
      text("x" + combo + " COMBO", W / 2, 84, 18, "#38f5c4");
      ctx.fillStyle = "#38f5c4"; ctx.fillRect(W / 2 - 40, 92, 80 * Math.max(0, comboTimer) / comboDur(), 3);
    }
    if (missText > 0) { ctx.globalAlpha = missText; text("CLOSE CALL +" + 15 * combo, W / 2, 150, 16, "#ffd23d"); ctx.globalAlpha = 1; }
    text("Best " + best, W - 14, 28, 16, "#8888aa", "right");
    text("Wave " + wave, W / 2, 110, 14, "#8888aa");
    if (waveBanner > 0) { ctx.globalAlpha = Math.min(1, waveBanner); text("WAVE " + wave + "!  +100", W / 2, 290, 30, "#ffd23d"); ctx.globalAlpha = 1; }
    if (bossBanner > 0) { ctx.globalAlpha = Math.min(1, bossBanner); text(wave >= 100 ? "FINAL BOSS" : "BOSS FIGHT!", W / 2, 330, 36, "#ff2d55"); text(boss ? boss.def.name : "", W / 2, 358, 22, "#ffffff"); text("Collect orbs to hit the boss", W / 2, 384, 16, "#ffd23d"); ctx.globalAlpha = 1; }
    if (banner) { ctx.globalAlpha = Math.min(1, banner.t); text(banner.text, W / 2, 430, 22, banner.color); ctx.globalAlpha = 1; }
    if (boss) {
      ctx.fillStyle = "rgba(255,255,255,0.12)"; ctx.fillRect(W / 2 - 120, 126, 240, 8);
      ctx.fillStyle = boss.def.color; ctx.fillRect(W / 2 - 120, 126, 240 * Math.max(0, boss.hp) / boss.maxhp, 8);
    }
    if (shieldT > 0) { ctx.fillStyle = "#4da3ff"; ctx.fillRect(14, 20, 80 * shieldT / shieldDur(), 6); text("Shield", 14, 44, 12, "#4da3ff", "left"); }
    if (slowT > 0) { ctx.fillStyle = "#ffd23d"; ctx.fillRect(14, 58, 80 * slowT / slowDur(), 6); text("Slow-mo", 14, 82, 12, "#ffd23d", "left"); }
  } else if (state === "menu") {
    text("NEON DODGE", W / 2, 240, 52, "#ffffff");
    text("Collect green orbs", W / 2, 310, 20, "#38f5c4");
    text("Dodge the red ones", W / 2, 340, 20, "#ff3d6e");
    text("S = Shield   Z = Slow-mo   B = Bomb", W / 2, 372, 16, "#ffd23d");
    text("Tap / click to start", W / 2, 450, 22);
    text("Mouse, touch or arrows/WASD  (P = Pause)", W / 2, 472, 15, "#8888aa");
    text("Lv " + save.level + "   " + rankLabel(save.rp) + "   " + save.rp + " RP", W / 2, 512, 19, RANKS[rankIdx(save.rp)].c);
    text((best ? "Best " + best + "    " : "") + "Streak " + save.streak, W / 2, 545, 16, "#8888aa");
    skinsButton();
  } else if (state === "skins") {
    drawSkinsScreen();
  } else if (state === "tree") {
    drawTreeScreen();
  } else if (state === "missions") {
    drawMissionsScreen();
  } else if (state === "win") {
    text("YOU WIN!", W / 2, 240, 56, "#ffd23d");
    text("The OVERLORD is defeated", W / 2, 290, 20, "#ffffff");
    text("Score " + Math.floor(score), W / 2, 350, 32);
    text("Time " + Math.floor(time) + "s   Orbs " + orbsCollected, W / 2, 392, 16, "#8888aa");

    if (newUnlocks.length) text("Unlocked: " + newUnlocks.join(", "), W / 2, 500, 16, "#ffd23d");

  } else {

    text(score >= best && best > 0 ? "New high score!" : "Best " + best, W / 2, 286, 20, "#38f5c4");
    text("Time " + Math.floor(time) + "s   Wave " + wave, W / 2, 318, 16, "#8888aa");
    text("Orbs " + orbsCollected + "   Close calls " + nearMiss, W / 2, 340, 16, "#8888aa");
    runSummary(380);
    if (overT > 0.6) text("Tap to try again", W / 2, 532, 20);
    if (newUnlocks.length) text("Unlocked: " + newUnlocks.join(", "), W / 2, 552, 16, "#ffd23d");
    skinsButton();
  }
}

function runSummary(y) {
  const ri = rankIdx(save.rp), L = [];
  L.push([rankLabel(save.rp) + "   " + (lastRun.d >= 0 ? "+" : "") + lastRun.d + " RP", RANKS[ri].c, 18]);
  if (lastRun.up) L.push(["RANK UP!", "#38f5c4", 14]); else if (lastRun.down) L.push(["Rank down", "#ff6b6b", 14]);
  L.push(["+" + lastRun.sp + " skill points    +" + lastRun.xp + " XP", "#ffd23d", 14]);
  if (lastRun.ups) L.push(["LEVEL UP! Lv " + save.level + "  (+" + lastRun.ups * 3 + " SP)", "#38f5c4", 14]);
  const ready = SKILLS.find(k => skillState(k) === "ok");
  L.push([ready ? "Skill ready to buy: " + ready.name + " (" + skillCost(ready) + " SP)"
                : ri < 6 ? "Next rank: " + RANKS[ri + 1].n + " in " + ((ri + 1) * 100 - save.rp) + " RP" : "", "#8888aa", 13]);
  L.forEach((l, i) => text(l[0], W / 2, y + i * 22, l[2], l[1]));
}
function button(x, label, y = 575) {
  ctx.strokeStyle = "#8888aa"; ctx.lineWidth = 2; ctx.strokeRect(x, y, 140, 45);
  text(label, x + 70, y + 29, 17, "#ffffff");
}
function skinsButton() {
  button(90, "SKINS");
  button(250, save.sp > 0 ? "SKILLS (" + save.sp + ")" : "SKILLS");
  button(170, missionsLeft() ? "MISSIONS (" + missionsLeft() + ")" : "MISSIONS", 632);
}
function drawMissionsScreen() {
  text("DAILY MISSIONS", W / 2, 60, 30);
  text("Streak: " + save.streak + " day" + (save.streak === 1 ? "" : "s") + "   (daily login bonus: " + Math.min(save.streak, 7) * 2 + " SP)", W / 2, 88, 14, "#ffd23d");
  const d = save.daily;
  d.picks.forEach((idx, i) => {
    const m = MISSIONS[idx], y = 120 + i * 90, done = d.done[i];
    ctx.fillStyle = "rgba(255,255,255,0.05)"; ctx.fillRect(30, y, W - 60, 76);
    ctx.strokeStyle = done ? "#38f5c4" : "rgba(255,255,255,0.12)"; ctx.lineWidth = 2; ctx.strokeRect(30, y, W - 60, 76);
    text(m.txt(m.vals[i]), 46, y + 34, 17, done ? "#38f5c4" : "#ffffff", "left");
    text(["Easy", "Medium", "Hard"][i], 46, y + 58, 12, "#8888aa", "left");
    text(done ? "DONE" : "+" + MISSION_REWARD[i] + " SP", W - 46, y + 44, 16, done ? "#38f5c4" : "#ffd23d", "right");
  });
  text("Complete all 3: +" + MISSION_BONUS + " SP bonus" + (d.bonus ? "  (claimed)" : ""), W / 2, 410, 15, d.bonus ? "#38f5c4" : "#ffd23d");
  text("Each mission must be done within a single run.", W / 2, 440, 12, "#8888aa");
  text("New missions every day. Play daily to build your streak!", W / 2, 460, 12, "#8888aa");
  backButton();
}
function backButton() {
  ctx.strokeStyle = "#8888aa"; ctx.lineWidth = 2; ctx.strokeRect(170, 664, 140, 44);
  text("BACK", W / 2, 693, 20);
}
function drawSkinsScreen() {
  text("SKINS", W / 2, 50, 32);
  const done = SKINS.filter(k => save.unlocked[k.id]).length;
  text(done + "/" + SKINS.length + " unlocked", W / 2, 72, 13, "#8888aa");
  SKINS.forEach((sk, i) => {
    const y = ROW_TOP + i * ROW_PITCH, open = !!save.unlocked[sk.id], on = save.skin === sk.id && open;
    ctx.fillStyle = on ? "rgba(56,245,196,0.12)" : "rgba(255,255,255,0.05)"; ctx.fillRect(30, y, W - 60, ROW_H);
    ctx.strokeStyle = on ? "#38f5c4" : "rgba(255,255,255,0.1)"; ctx.lineWidth = 2; ctx.strokeRect(30, y, W - 60, ROW_H);
    ctx.globalAlpha = open ? 1 : 0.25; drawSkin(sk, 60, y + 20, 10); ctx.globalAlpha = 1;
    text(sk.name, 86, y + 17, 15, open ? "#ffffff" : "#8888aa", "left");
    text(sk.goal, 86, y + 32, 11, open ? "#8888aa" : "#ffd23d", "left");
    const right = on ? "EQUIPPED" : open ? "TAP TO USE" : (sk.prog ? sk.prog() : "LOCKED");
    text(right, W - 44, y + 24, 11, on ? "#38f5c4" : "#8888aa", "right");
  });
  backButton();
}
function drawTreeScreen() {
  text("SKILL TREE", W / 2, 50, 32);
  text("Skill points: " + save.sp + "   (earned each run: waves + bosses)", W / 2, 72, 13, "#ffd23d");
  SKILLS.forEach((k, i) => {
    const y = 96 + i * 56, st = skillState(k), lv = lvl(k.id);
    ctx.fillStyle = "rgba(255,255,255,0.05)"; ctx.fillRect(30, y, W - 60, 48);
    ctx.strokeStyle = st === "ok" ? BRANCH[k.branch] : "rgba(255,255,255,0.1)"; ctx.lineWidth = 2; ctx.strokeRect(30, y, W - 60, 48);
    ctx.fillStyle = BRANCH[k.branch]; ctx.fillRect(30, y, 5, 48);
    const dim = st === "needs";
    text(k.name, 46, y + 20, 16, dim ? "#666680" : "#ffffff", "left");
    text(dim ? "Needs " + SKILLS.find(q => q.id === k.req[0]).name + " lvl " + k.req[1] : k.desc, 46, y + 38, 12, dim ? "#ff6b6b" : "#8888aa", "left");
    let pips = "";
    for (let q = 0; q < k.max; q++) pips += q < lv ? "\u25CF" : "\u25CB";
    text(pips, W - 46, y + 20, 14, BRANCH[k.branch], "right");
    text(st === "max" ? "MAX" : skillCost(k) + " SP", W - 46, y + 38, 12, st === "ok" ? "#ffd23d" : "#8888aa", "right");
  });
  text("Blue = Defense   Green = Flow   Orange = Offense", W / 2, 640, 12, "#8888aa");
  backButton();
}

function drawOverlay() {
  if (state === "play" || state === "menu") text(muted ? "Sound off (M)" : "Sound on (M)", W - 14, 62, 13, "#8888aa", "right");
  if (paused) {
    ctx.fillStyle = "rgba(10,10,20,0.75)"; ctx.fillRect(0, 0, W, H);
    text("PAUSE", W / 2, 330, 48);
    text("Tap or press P to resume", W / 2, 380, 18, "#8888aa");
  }
}

// --- Loop ---
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  drawOverlay();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
